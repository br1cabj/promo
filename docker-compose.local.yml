# Override SOLO para pruebas locales en esta PC.
#
# Conecta el panel a la red del stack `evolution-local` y apunta a la API por
# su nombre de servicio (`evolution-api`), así el contenedor del panel no
# depende de puertos publicados en el host.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Requiere que el stack de evolution-local ya esté levantado (crea la red
# externa `evolution-local`).
services:
  promopanel:
    environment:
      EVOLUTION_URL: http://evolution-api:8080
    networks:
      - default
      - evolution-local

networks:
  evolution-local:
    external: true
    name: evolution-local
